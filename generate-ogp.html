<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OGP Image Generator</title>
</head>
<body style="background:#333;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0">
<div>
  <canvas id="c" width="1200" height="630"></canvas>
  <br>
  <button onclick="download()" style="margin-top:10px;padding:10px 20px;font-size:16px;cursor:pointer">Download PNG</button>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

// Background
const bg = ctx.createLinearGradient(0, 0, 1200, 630);
bg.addColorStop(0, '#0f172a');
bg.addColorStop(1, '#1e1b4b');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, 1200, 630);

// Subtle grid pattern
ctx.strokeStyle = '#ffffff06';
ctx.lineWidth = 1;
for (let x = 0; x < 1200; x += 40) {
  ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 630); ctx.stroke();
}
for (let y = 0; y < 630; y += 40) {
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1200, y); ctx.stroke();
}

// Glow effect behind logo
const glow = ctx.createRadialGradient(200, 315, 0, 200, 315, 200);
glow.addColorStop(0, '#3b82f620');
glow.addColorStop(0.5, '#a855f710');
glow.addColorStop(1, 'transparent');
ctx.fillStyle = glow;
ctx.fillRect(0, 115, 400, 400);

// Logo "Py" box
const logoGrad = ctx.createLinearGradient(120, 230, 280, 400);
logoGrad.addColorStop(0, '#3b82f6');
logoGrad.addColorStop(1, '#a855f7');
ctx.beginPath();
ctx.roundRect(120, 230, 160, 160, 30);
ctx.fillStyle = logoGrad;
ctx.fill();

ctx.font = 'bold 90px "Segoe UI", sans-serif';
ctx.fillStyle = '#ffffff';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('Py', 200, 315);

// Title "PyMasters"
ctx.font = 'bold 72px "Segoe UI", sans-serif';
ctx.fillStyle = '#ffffff';
ctx.textAlign = 'left';
ctx.textBaseline = 'middle';
ctx.fillText('PyMasters', 340, 270);

// Subtitle
ctx.font = '32px "Segoe UI", sans-serif';
ctx.fillStyle = '#94a3b8';
ctx.fillText('ブラウザだけでPythonをマスター', 340, 340);

// Feature badges
const badges = ['✨ 無料', '🐍 Python', '📊 自動採点', '🎮 インタラクティブ'];
let bx = 340;
ctx.font = '22px "Segoe UI", sans-serif';
badges.forEach(badge => {
  const w = ctx.measureText(badge).width + 30;
  ctx.fillStyle = '#ffffff10';
  ctx.beginPath();
  ctx.roundRect(bx, 380, w, 40, 10);
  ctx.fill();
  ctx.fillStyle = '#cbd5e1';
  ctx.textBaseline = 'middle';
  ctx.fillText(badge, bx + 15, 400);
  bx += w + 12;
});

// Code snippet decoration (bottom right)
const codeX = 750, codeY = 460;
ctx.fillStyle = '#0f172a';
ctx.strokeStyle = '#334155';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.roundRect(codeX, codeY, 400, 140, 12);
ctx.fill();
ctx.stroke();

// Code header bar
ctx.fillStyle = '#1e293b';
ctx.beginPath();
ctx.roundRect(codeX, codeY, 400, 32, [12, 12, 0, 0]);
ctx.fill();

// Dots
[['#ef4444', 0], ['#f59e0b', 16], ['#22c55e', 32]].forEach(([color, offset]) => {
  ctx.beginPath();
  ctx.arc(codeX + 16 + offset, codeY + 16, 5, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
});

ctx.font = '11px monospace';
ctx.fillStyle = '#64748b';
ctx.textAlign = 'left';
ctx.fillText('lesson.py', codeX + 160, codeY + 20);

// Code lines
ctx.font = '18px "Cascadia Code", monospace';
const lines = [
  { parts: [['#c084fc', 'print'], ['#e4e4e7', '('], ['#86efac', '"Hello World!"'], ['#e4e4e7', ')']] },
  { parts: [['#93c5fd', 'name'], ['#e4e4e7', ' = '], ['#86efac', '"PyMasters"']] },
  { parts: [['#c084fc', 'print'], ['#e4e4e7', '('], ['#93c5fd', 'f'], ['#86efac', '"{name} 🚀"'], ['#e4e4e7', ')']] },
];
lines.forEach((line, i) => {
  let lx = codeX + 16;
  ctx.fillStyle = '#4a5568';
  ctx.fillText((i + 1) + '', lx, codeY + 60 + i * 30);
  lx += 30;
  line.parts.forEach(([color, text]) => {
    ctx.fillStyle = color;
    ctx.fillText(text, lx, codeY + 60 + i * 30);
    lx += ctx.measureText(text).width;
  });
});

function download() {
  const a = document.createElement('a');
  a.download = 'ogp.png';
  a.href = c.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
